# ==============================================================================
# Release install (D4): base.cfg + first-boot deploy of the release named at boot. D1: unattended RHEL 9.8 install from the repo server on deploy-offline (no internet).
# Based on ~/ansible-cis/golden-images/kickstart/ks-rhel9.cfg (UEFI + CIS LVM layout),
# minus registration, cloud-init and Packer. No keys or secrets in this file:
# the admin's SSH key is fetched from the repo server in %post.
# ==============================================================================

# ---- Installer ------------------------------------------------------------------
text
eula --agreed
skipx
firstboot --disable
reboot

# Packages come only from the repo server.
url --url=http://192.168.150.10/rhel9/9.8/BaseOS
repo --name=AppStream --baseurl=http://192.168.150.10/rhel9/9.8/AppStream

# ---- Localization -----------------------------------------------------------------
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone UTC --utc

# ---- Network ----------------------------------------------------------------------
network --bootproto=dhcp --device=link --onboot=yes --activate --hostname=ks-test

# ---- Security baseline ------------------------------------------------------------
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd

# ---- Accounts ---------------------------------------------------------------------
# No passwords: root locked, the admin logs in with the SSH key only.
rootpw --lock
user --name=frqadmin --groups=wheel --lock

# ---- Disk: UEFI (GPT) + LVM ---------------------------------------------------------
zerombr
ignoredisk --only-use=vda
clearpart --all --initlabel --disklabel=gpt --drives=vda
bootloader --location=mbr --boot-drive=vda

# /boot/efi and /boot stay outside LVM: firmware and GRUB read them before LVM exists.
part /boot/efi --fstype=efi --size=600
part /boot     --fstype=xfs --size=1024
part pv.01     --size=1 --grow
volgroup vg_sys pv.01

# CIS layout: separate /tmp, /var, /var/tmp, /var/log, /var/log/audit, /home.
logvol /               --vgname=vg_sys --name=lv_root   --fstype=xfs  --size=8192
logvol /home           --vgname=vg_sys --name=lv_home   --fstype=xfs  --size=1024
logvol /tmp            --vgname=vg_sys --name=lv_tmp    --fstype=xfs  --size=1024
logvol /var            --vgname=vg_sys --name=lv_var    --fstype=xfs  --size=3072
logvol /var/tmp        --vgname=vg_sys --name=lv_vartmp --fstype=xfs  --size=1024
logvol /var/log        --vgname=vg_sys --name=lv_varlog --fstype=xfs  --size=1024
logvol /var/log/audit  --vgname=vg_sys --name=lv_audit  --fstype=xfs  --size=1024
logvol swap            --vgname=vg_sys --name=lv_swap   --fstype=swap --size=1024

%addon com_redhat_kdump --disable
%end

# ---- Packages ---------------------------------------------------------------------
%packages
@^minimal-environment
# Python for the Ansible venv from the release bundle (ansible-core 2.16, as in CI); the DVD only has 2.14.
python3.11
%end

# ---- Post-install: repos, admin key, sudo --------------------------------------------
%post --log=/root/ks-post.log
set -euo pipefail
REPO=http://192.168.150.10

# The installed system has no repos of its own; point dnf at the repo server.
cat > /etc/yum.repos.d/deploy-offline.repo <<EOF
[BaseOS]
name=RHEL 9.8 BaseOS (repo server)
baseurl=$REPO/rhel9/9.8/BaseOS
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

[AppStream]
name=RHEL 9.8 AppStream (repo server)
baseurl=$REPO/rhel9/9.8/AppStream
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
EOF

# The admin's public key lives on the repo server, not in git.
install -d -m 0700 -o frqadmin -g frqadmin /home/frqadmin/.ssh
curl -fsS "$REPO/ks/authorized_keys" -o /home/frqadmin/.ssh/authorized_keys
chown frqadmin:frqadmin /home/frqadmin/.ssh/authorized_keys
chmod 0600 /home/frqadmin/.ssh/authorized_keys
restorecon -R /home/frqadmin/.ssh

# The admin has no password (locked), so sudo must not ask for one. Lab only.
echo 'frqadmin ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/frqadmin
chmod 0440 /etc/sudoers.d/frqadmin
%end

# ==============================================================================
# Deploy a release: %post fetches the release named on the installer's boot line, checks its checksum, makes the
# venv, writes and enables the first-boot unit. Everything above is base.cfg unchanged.
# Boot with: inst.ks=http://192.168.150.10/ks/deploy.cfg deploy.release=<VERSION>
# --erroronfail: no release, a bad checksum or any other error stops the install, instead of a machine that boots
# without its configuration (lesson from D2).
# ==============================================================================
%post --erroronfail --log=/root/ks-post-deploy.log
set -euxo pipefail
REPO=http://192.168.150.10

# The kernel keeps unknown boot options in /proc/cmdline; the installer ignores them.
REL=$(sed -n 's/.*deploy\.release=\([^ ]*\).*/\1/p' /proc/cmdline)
[ -n "$REL" ] || { echo "No deploy.release=<VERSION> on the boot line"; exit 1; }

cd /tmp
curl -fsSO "$REPO/releases/$REL/deploy-$REL.tar.gz"
curl -fsSO "$REPO/releases/$REL/deploy-$REL.tar.gz.sha256"
sha256sum -c "deploy-$REL.tar.gz.sha256"
mkdir -p /opt/deploy
tar -xzf "deploy-$REL.tar.gz" -C /opt/deploy
rm -f "deploy-$REL.tar.gz" "deploy-$REL.tar.gz.sha256"

# ansible-core as pinned in CI, from the bundled wheels, no internet (works in the installer, proven in D2).
python3.11 -m venv /opt/deploy/venv
/opt/deploy/venv/bin/pip install --no-index --find-links /opt/deploy/wheels -r /opt/deploy/requirements-ansible.txt

# The first-boot unit, written here as in Foreman/Satellite and Red Hat's own kickstarts. It runs the playbook once,
# after the reboot, on the real system (systemd, services and firewalld up). Output: journalctl -u deploy-firstboot
cat > /etc/systemd/system/deploy-firstboot.service <<'UNIT'
[Unit]
Description=Deploy: run the release playbook once
Wants=network-online.target
After=network-online.target
# Skipped after a successful run; a failed run is retried at the next boot.
ConditionPathExists=!/var/lib/deploy/done

[Service]
Type=oneshot
# systemd starts services with no UTF-8 locale; ansible-core refuses to start without one (LC_ALL overrides LANG).
Environment=LC_ALL=C.UTF-8
WorkingDirectory=/opt/deploy
# Creates /var/lib/deploy for the marker and the record.
StateDirectory=deploy
ExecStart=/opt/deploy/venv/bin/ansible-playbook playbooks/main_playbook.yml
# Runs only when ExecStart succeeded.
ExecStartPost=/usr/bin/touch /var/lib/deploy/done
# Always runs; systemd sets SERVICE_RESULT (success, exit-code, ...). $$ passes a literal $ to the shell.
ExecStopPost=/bin/sh -c 'echo "$$(date -Is) release=$$(cat RELEASE) result=$$SERVICE_RESULT" >> /var/lib/deploy/record'

[Install]
WantedBy=multi-user.target
UNIT
restorecon -R /opt/deploy /etc/systemd/system/deploy-firstboot.service
# enable only writes a symlink, so it works in the installer; the unit starts at the first boot.
systemctl enable deploy-firstboot.service
%end
