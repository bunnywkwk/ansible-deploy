# ==============================================================================
# D2: base.cfg + the playbook in %post. D1: unattended RHEL 9.8 install from the repo server on deploy-offline (no internet).
# Based on ~/ansible-cis/golden-images/kickstart/ks-rhel9.cfg (UEFI + CIS LVM layout),
# minus registration, cloud-init and Packer. No keys or secrets in this file:
# the admin's SSH key is fetched from the repo server in %post.
# ==============================================================================

# ---- Installer ------------------------------------------------------------------
text
eula --agreed
skipx
firstboot --disable
reboot

# Packages come only from the repo server.
url --url=http://192.168.150.10/rhel9/9.8/BaseOS
repo --name=AppStream --baseurl=http://192.168.150.10/rhel9/9.8/AppStream

# ---- Localization -----------------------------------------------------------------
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone UTC --utc

# ---- Network ----------------------------------------------------------------------
network --bootproto=dhcp --device=link --onboot=yes --activate --hostname=ks-test

# ---- Security baseline ------------------------------------------------------------
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd

# ---- Accounts ---------------------------------------------------------------------
# No passwords: root locked, the admin logs in with the SSH key only.
rootpw --lock
user --name=frqadmin --groups=wheel --lock

# ---- Disk: UEFI (GPT) + LVM ---------------------------------------------------------
zerombr
ignoredisk --only-use=vda
clearpart --all --initlabel --disklabel=gpt --drives=vda
bootloader --location=mbr --boot-drive=vda

# /boot/efi and /boot stay outside LVM: firmware and GRUB read them before LVM exists.
part /boot/efi --fstype=efi --size=600
part /boot     --fstype=xfs --size=1024
part pv.01     --size=1 --grow
volgroup vg_sys pv.01

# CIS layout: separate /tmp, /var, /var/tmp, /var/log, /var/log/audit, /home.
logvol /               --vgname=vg_sys --name=lv_root   --fstype=xfs  --size=8192
logvol /home           --vgname=vg_sys --name=lv_home   --fstype=xfs  --size=1024
logvol /tmp            --vgname=vg_sys --name=lv_tmp    --fstype=xfs  --size=1024
logvol /var            --vgname=vg_sys --name=lv_var    --fstype=xfs  --size=3072
logvol /var/tmp        --vgname=vg_sys --name=lv_vartmp --fstype=xfs  --size=1024
logvol /var/log        --vgname=vg_sys --name=lv_varlog --fstype=xfs  --size=1024
logvol /var/log/audit  --vgname=vg_sys --name=lv_audit  --fstype=xfs  --size=1024
logvol swap            --vgname=vg_sys --name=lv_swap   --fstype=swap --size=1024

%addon com_redhat_kdump --disable
%end

# ---- Packages ---------------------------------------------------------------------
%packages
@^minimal-environment
# Python for the Ansible venv from the release bundle (ansible-core 2.16, as in CI); the DVD only has 2.14.
python3.11
%end

# ---- Post-install: repos, admin key, sudo --------------------------------------------
%post --log=/root/ks-post.log
set -euo pipefail
REPO=http://192.168.150.10

# The installed system has no repos of its own; point dnf at the repo server.
cat > /etc/yum.repos.d/deploy-offline.repo <<EOF
[BaseOS]
name=RHEL 9.8 BaseOS (repo server)
baseurl=$REPO/rhel9/9.8/BaseOS
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

[AppStream]
name=RHEL 9.8 AppStream (repo server)
baseurl=$REPO/rhel9/9.8/AppStream
gpgcheck=1
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
EOF

# The admin's public key lives on the repo server, not in git.
install -d -m 0700 -o frqadmin -g frqadmin /home/frqadmin/.ssh
curl -fsS "$REPO/ks/authorized_keys" -o /home/frqadmin/.ssh/authorized_keys
chown frqadmin:frqadmin /home/frqadmin/.ssh/authorized_keys
chmod 0600 /home/frqadmin/.ssh/authorized_keys
restorecon -R /home/frqadmin/.ssh

# The admin has no password (locked), so sudo must not ask for one. Lab only.
echo 'frqadmin ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/frqadmin
chmod 0440 /etc/sudoers.d/frqadmin
%end

# ==============================================================================
# D2 experiment, kept as the record of the %post option (in use: deploy.cfg): run the playbook inside the installer, to see what fails there.
# Everything above is base.cfg unchanged. No `set -e`: every step runs, and the log shows each result.
# ==============================================================================
%post --log=/root/ks-post-playbook.log
set -x
REPO=http://192.168.150.10
# %post runs with LC_ALL=C, which overrides LANG; ansible-core refuses to start without UTF-8.
# C.UTF-8 is built into glibc. The env line logs what the installer set, to confirm the cause.
env | grep -E '^(LANG|LC_)'
export LC_ALL=C.UTF-8

mkdir -p /opt/deploy
curl -fsS "$REPO/releases/d2/deploy-d2.tar.gz" | tar -xz -C /opt/deploy

# ansible-core 2.16.20 from the bundled wheels, no internet.
python3.11 -m venv /opt/deploy/venv
/opt/deploy/venv/bin/pip install --no-index --find-links /opt/deploy/wheels -r /opt/deploy/requirements-ansible.txt

# One run per role, so a failure in one does not hide the result of the other.
cd /opt/deploy
/opt/deploy/venv/bin/ansible-playbook playbooks/main_playbook.yml --tags motd
/opt/deploy/venv/bin/ansible-playbook playbooks/main_playbook.yml --tags webserver
%end
